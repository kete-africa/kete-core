name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secret in the repository or its history (gitleaks, values redacted)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, formatting, generated contracts and design, READMEs, catalogs, Knip, audit
        run: pnpm check
      - name: A changed package carries a changeset (decision 0006)
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      - name: The documentation site builds, with no broken link
        run: pnpm docs:build
      - name: Migrate the Compte Kete "test" branch
        run: pnpm --filter @kete/account db:migrate
        env:
          ACCOUNT_OWNER_URL: ${{ secrets.ACCOUNT_TEST_OWNER_URL }}
      - name: Migrate the Kete Cockpit "test" branch
        run: pnpm --filter @kete/cockpit db:migrate
        env:
          COCKPIT_OWNER_URL: ${{ secrets.COCKPIT_TEST_OWNER_URL }}
      - name: Tests (integration on the Neon "test" branches)
        run: pnpm test
        env:
          KETE_TEST_OWNER_URL: ${{ secrets.KETE_TEST_OWNER_URL }}
          KETE_TEST_APP_URL: ${{ secrets.KETE_TEST_APP_URL }}
          ACCOUNT_TEST_OWNER_URL: ${{ secrets.ACCOUNT_TEST_OWNER_URL }}
          ACCOUNT_TEST_APP_URL: ${{ secrets.ACCOUNT_TEST_APP_URL }}
          ACCOUNT_TEST_AUTH_SECRET: ${{ secrets.ACCOUNT_TEST_AUTH_SECRET }}
          COCKPIT_TEST_APP_URL: ${{ secrets.COCKPIT_TEST_APP_URL }}
          ACCOUNT_TEST_STORAGE_ENDPOINT: ${{ secrets.ACCOUNT_TEST_STORAGE_ENDPOINT }}
          ACCOUNT_TEST_STORAGE_REGION: ${{ secrets.ACCOUNT_TEST_STORAGE_REGION }}
          ACCOUNT_TEST_STORAGE_BUCKET: ${{ secrets.ACCOUNT_TEST_STORAGE_BUCKET }}
          ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID }}
          ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY }}

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the Postgres image once (with retries), before the tests start
        run: for attempt in 1 2 3; do docker pull pgvector/pgvector:pg17 && break; sleep 10; done
      - name: The packages' tests on a plain Postgres in a container (doctrine D-029)
        run: pnpm exec vitest run --project tenancy --project testing --project commands --project records --project drafts --project capabilities --project sdk
        env:
          KETE_TEST_POSTGRES: container

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kete/account exec playwright install --with-deps chromium
      - name: Compte Kete and Kete Cockpit in a browser (production builds, Neon "test" branch)
        run: pnpm test:e2e
        env:
          ACCOUNT_TEST_APP_URL: ${{ secrets.ACCOUNT_TEST_APP_URL }}
          ACCOUNT_TEST_OWNER_URL: ${{ secrets.ACCOUNT_TEST_OWNER_URL }}
          COCKPIT_TEST_APP_URL: ${{ secrets.COCKPIT_TEST_APP_URL }}
          ACCOUNT_TEST_AUTH_SECRET: ${{ secrets.ACCOUNT_TEST_AUTH_SECRET }}
          ACCOUNT_TEST_STORAGE_ENDPOINT: ${{ secrets.ACCOUNT_TEST_STORAGE_ENDPOINT }}
          ACCOUNT_TEST_STORAGE_REGION: ${{ secrets.ACCOUNT_TEST_STORAGE_REGION }}
          ACCOUNT_TEST_STORAGE_BUCKET: ${{ secrets.ACCOUNT_TEST_STORAGE_BUCKET }}
          ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID }}
          ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the Compte Kete image
        run: docker build -f apps/account/Dockerfile -t kete-account:ci .
      - name: The image starts and reports healthy (Neon "test" branch)
        env:
          ACCOUNT_TEST_APP_URL: ${{ secrets.ACCOUNT_TEST_APP_URL }}
          ACCOUNT_TEST_AUTH_SECRET: ${{ secrets.ACCOUNT_TEST_AUTH_SECRET }}
          ACCOUNT_TEST_STORAGE_ENDPOINT: ${{ secrets.ACCOUNT_TEST_STORAGE_ENDPOINT }}
          ACCOUNT_TEST_STORAGE_REGION: ${{ secrets.ACCOUNT_TEST_STORAGE_REGION }}
          ACCOUNT_TEST_STORAGE_BUCKET: ${{ secrets.ACCOUNT_TEST_STORAGE_BUCKET }}
          ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID }}
          ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          docker run -d --name account -p 3000:3000             -e ACCOUNT_DATABASE_URL="$ACCOUNT_TEST_APP_URL"             -e BETTER_AUTH_SECRET="$ACCOUNT_TEST_AUTH_SECRET"             -e BETTER_AUTH_URL="http://localhost:3000"             -e ACCOUNT_STORAGE_ENDPOINT="$ACCOUNT_TEST_STORAGE_ENDPOINT"             -e ACCOUNT_STORAGE_REGION="$ACCOUNT_TEST_STORAGE_REGION"             -e ACCOUNT_STORAGE_BUCKET="$ACCOUNT_TEST_STORAGE_BUCKET"             -e ACCOUNT_STORAGE_ACCESS_KEY_ID="$ACCOUNT_TEST_STORAGE_ACCESS_KEY_ID"             -e ACCOUNT_STORAGE_SECRET_ACCESS_KEY="$ACCOUNT_TEST_STORAGE_SECRET_ACCESS_KEY"             -e KETE_ENVIRONMENT=preview             kete-account:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health | grep -q '"status":"healthy"'
          curl -fsS http://localhost:3000/.well-known/kete | grep -q '"environment":"preview"'
          curl -fsS -o /dev/null http://localhost:3000/connexion
          docker inspect --format '{{.State.Health.Status}}' account
      - name: Build the Kete Cockpit image, which starts and reports healthy
        run: |
          docker build -f apps/cockpit/Dockerfile -t kete-cockpit:ci .
          docker run -d --name cockpit -p 3001:3000 kete-cockpit:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q '"status":"healthy"'
      - name: Container logs
        if: failure()
        run: |
          docker logs account || true
          docker logs cockpit || true
