name: Packages

# Publishes @kete-africa/* to GitHub Packages (decision 0005) when a package's version is not in
# the registry yet. A published version is never overwritten: bump the version to publish again.
on:
  push:
    branches: [dev]
    paths: ['packages/**', '.github/workflows/packages.yml']
  workflow_dispatch:

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kete-africa'
      - run: pnpm install --frozen-lockfile
      - name: Build the packages (JavaScript and types in dist/)
        run: pnpm exec tsc -b
      - name: Publish each package whose version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
            else
              (cd "$dir" && pnpm publish --no-git-checks)
              echo "Published ${name}@${version}"
            fi
          done
