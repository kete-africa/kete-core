name: Packages

# Publishes @kete-africa/* to GitHub Packages (decision 0005) with Changesets (decision 0006): every
# package whose version is not in the registry yet. A published version is never overwritten; a
# release branch bumps the versions with `pnpm release:version`.
on:
  push:
    branches: [dev]
    paths: ['packages/**', '.changeset/**', '.github/workflows/packages.yml']
  workflow_dispatch:

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kete-africa'
      - run: pnpm install --frozen-lockfile
      - name: Build the packages (JavaScript and types in dist/)
        run: pnpm exec tsc -b
      - name: The generic views' page (@kete/views)
        run: pnpm --filter @kete-africa/views build
      - name: Publish each package whose version is not in the registry yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm changeset publish --no-git-tag
