packages:
  - packages/*
  - apps/*
  - examples/*
  - templates/*

allowBuilds:
  esbuild: true
  # Optional native builds of the Testcontainers stack (ssh2): the JavaScript fallbacks suffice.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # officeparser brings Tesseract for its optional OCR, which Kete does not use (scans go to the model).
  tesseract.js: false

overrides:
  # starlight-openapi's httpsnippet pins a form-data with a known flaw (GHSA-hmw2-7cc7-3qxx).
  httpsnippet>form-data: ^4.0.6
  # postcss still asks for a source-map-js that stalls on crafted source maps (GHSA-68fv-2mgg-jv7q).
  source-map-js: ^1.2.2
  # Fixed versions of three high advisories published on 2026-10-06 to 16 (GHSA-587h-7wmj-h5pm,
  # GHSA-gfr2-rv44-r23c, and vite's for 8.3.0 to 8.3.2), until each dependent asks for them.
  'vite@>=8.3.0 <8.3.3': ^8.3.4
  'launch-editor@<2.14.2': ^2.14.2
  'markdown-it@>=14.1.0 <14.3.3': ^14.3.3
  # DOMPurify, under mermaid in the documentation site: a critical and a high advisory published on
  # 2026-10-22 (GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr), fixed in 3.4.17.
  'dompurify@<3.4.17': ^3.4.17
  # Zod can exhaust memory validating oversized input (GHSA-mrhx-c7xc-m3w5, published 2026-10-23):
  # every zod 4 lifted to 4.6.6.
  'zod@>=4.0.0 <4.6.6': ^4.6.6

# Advisories without a fix that only reach build-time code (decision 0007). Reviewed at each release.
auditConfig:
  ignoreGhsas:
    - GHSA-ch52-4w7c-c8xp
    - GHSA-vfj7-8cjw-p6xm
    # Zod 3, under @google/design.md only (no fixed 3.x): it lints and exports Kete's own DESIGN.md
    # at build time; zod 4 everywhere at run time is lifted by the override above.
    - GHSA-mrhx-c7xc-m3w5
